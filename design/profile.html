<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

        --background: #f4f6f8;
        --foreground: #0f1f3d;
        --primary: #0f1f3d;
        --primary-foreground: #ffffff;
        --secondary: #f59e0b;
        --secondary-foreground: #ffffff;
        --muted: #e2e8f0;
        --muted-foreground: #64748b;
        --accent: #00d0b6;
        --accent-foreground: #00332d;
        --destructive: #dc2626;
        --card: #ffffff;
        --card-foreground: #0f1f3d;
        --popover: #ffffff;
        --popover-foreground: #0f1f3d;
        --border: #e2e8f0;
        --input: #ffffff;
        --ring: #00d0b6;
        --chart-1: #00d0b6;
        --chart-2: #f59e0b;
        --chart-3: #0f1f3d;
        --chart-4: #38bdf8;
        --chart-5: #ef4444;

        --font-sans: "Inter";
        --font-heading: "Inter";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.75rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col h-screen bg-background text-foreground font-sans">
      <header
        class="bg-primary text-primary-foreground pt-16 pb-12 px-8 flex flex-col items-center rounded-b-[40px] relative overflow-hidden"
      >
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/5 rounded-full"></div>
        <div class="absolute top-20 -left-10 w-24 h-24 bg-accent/20 rounded-full blur-2xl"></div>
        <div class="relative">
          <div class="w-32 h-32 rounded-full border-4 border-accent/30 p-1">
            <img
              alt="Profile"
              src="https://randomuser.me/api/portraits/men/12.jpg"
              class="w-full h-full rounded-full object-cover"
            />
          </div>
          <div
            class="absolute bottom-1 right-1 bg-accent text-accent-foreground p-2 rounded-full border-4 border-primary"
          >
            <iconify-icon icon="ph:camera-bold" width="16" height="16"></iconify-icon>
          </div>
        </div>
        <h1 class="text-2xl font-heading font-bold mt-4 tracking-tight">Roberto Silva</h1>
        <p class="text-primary-foreground/70 font-medium text-sm">Desenvolvedor Sênior</p>
      </header>
      <main class="flex-1 px-6 -mt-8 pb-24 relative z-10">
        <div class="flex flex-col gap-4">
          <div
            class="bg-card border border-border p-6 rounded-[24px] shadow-sm flex flex-col gap-5"
          >
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold text-muted-foreground uppercase tracking-widest">
                Informações Profissionais
              </h2>
              <button class="text-accent font-bold text-xs">DETALHES</button>
            </div>
            <div class="flex flex-col gap-4">
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 rounded-xl flex items-center justify-center text-primary"
                >
                  <iconify-icon
                    icon="ph:identification-card-bold"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
                    >Matrícula</span
                  ><span class="text-base font-semibold tabular-nums text-primary">#9928344</span>
                </div>
              </div>
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 rounded-xl flex items-center justify-center text-primary"
                >
                  <iconify-icon icon="ph:briefcase-bold" width="20" height="20"></iconify-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
                    >Departamento</span
                  ><span class="text-base font-semibold text-primary"
                    >Tecnologia da Informação</span
                  >
                </div>
              </div>
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 rounded-xl flex items-center justify-center text-primary"
                >
                  <iconify-icon icon="ph:calendar-check-bold" width="20" height="20"></iconify-icon>
                </div>
                <div class="flex flex-col">
                  <span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
                    >Data de Admissão</span
                  ><span class="text-base font-semibold text-primary">12 de Agosto, 2019</span>
                </div>
              </div>
            </div>
          </div>
          <div
            class="bg-card border border-border p-6 rounded-[24px] shadow-sm flex flex-col gap-4"
          >
            <button class="flex items-center justify-between w-full group">
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 group-hover:bg-accent/10 rounded-xl flex items-center justify-center text-primary group-hover:text-accent transition-colors"
                >
                  <iconify-icon icon="ph:user-focus-bold" width="20" height="20"></iconify-icon>
                </div>
                <span class="text-base font-semibold">Editar Perfil</span>
              </div>
              <iconify-icon
                icon="ph:caret-right-bold"
                width="20"
                height="20"
                class="text-muted-foreground"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50"></div>
            <button class="flex items-center justify-between w-full group">
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 group-hover:bg-accent/10 rounded-xl flex items-center justify-center text-primary group-hover:text-accent transition-colors"
                >
                  <iconify-icon icon="ph:article-bold" width="20" height="20"></iconify-icon>
                </div>
                <span class="text-base font-semibold">Meu Ponto (Espelho)</span>
              </div>
              <iconify-icon
                icon="ph:caret-right-bold"
                width="20"
                height="20"
                class="text-muted-foreground"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50"></div>
            <button class="flex items-center justify-between w-full group">
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 group-hover:bg-accent/10 rounded-xl flex items-center justify-center text-primary group-hover:text-accent transition-colors"
                >
                  <iconify-icon
                    icon="ph:chat-teardrop-text-bold"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-base font-semibold">Justificativas</span>
              </div>
              <iconify-icon
                icon="ph:caret-right-bold"
                width="20"
                height="20"
                class="text-muted-foreground"
              ></iconify-icon>
            </button>
            <div class="h-px bg-border/50"></div>
            <button class="flex items-center justify-between w-full group">
              <div class="flex items-center gap-4">
                <div
                  class="w-10 h-10 bg-muted/50 group-hover:bg-destructive/10 rounded-xl flex items-center justify-center text-destructive transition-colors"
                >
                  <iconify-icon icon="ph:sign-out-bold" width="20" height="20"></iconify-icon>
                </div>
                <span class="text-base font-semibold text-destructive">Sair do Aplicativo</span>
              </div>
            </button>
          </div>
          <p
            class="text-center text-[10px] font-bold text-muted-foreground uppercase tracking-widest mt-2"
          >
            Cronos v2.4.12 • Built with Trust
          </p>
        </div>
      </main>
      <nav
        class="absolute bottom-0 w-full bg-card border-t border-border flex items-center justify-between pb-safe pt-2 px-6 h-20 shadow-[0_-4px_24px_rgba(0,0,0,0.02)] z-10"
      >
        <button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground transition-colors flex-1"
        >
          <iconify-icon icon="ph:clock-bold" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium">Bater Ponto</span></button
        ><button
          class="flex flex-col items-center gap-1 text-muted-foreground hover:text-foreground transition-colors flex-1"
        >
          <iconify-icon icon="ph:list-dashes-bold" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-medium">Histórico</span></button
        ><button class="flex flex-col items-center gap-1 text-primary flex-1">
          <iconify-icon icon="ph:user-fill" width="24" height="24"></iconify-icon
          ><span class="text-[10px] font-semibold">Perfil</span>
        </button>
      </nav>
    </div>
  </body>
</html>
